<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anymone tx bus</title>
<style>
  :root { --bg:#0b0e14; --panel:#121620; --line:#1d2330; --fg:#c9d3e0; --dim:#5b6878; --accent:#1fe0c8; --warn:#e0a11f; --bad:#e05b5b; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:12px; flex-wrap:wrap; }
  header .brand { font-weight:700; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }
  section { display:flex; flex-direction:column; min-width:0; }
  #left { width:min(46%, 620px); border-right:1px solid var(--line); }
  #right { flex:1; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim);
       margin:0; padding:12px 18px 8px; }
  .scroll { flex:1; overflow-y:auto; padding:0 18px 14px; }
  .empty { color:var(--dim); padding:4px 0; }
  form { padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel); }
  textarea { width:100%; height:82px; resize:vertical; background:var(--bg);
             border:1px solid var(--line); color:var(--fg); padding:9px 11px;
             border-radius:6px; font:inherit; word-break:break-all; }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  button { background:var(--accent); color:#05201c; border:0; padding:9px 18px;
           border-radius:6px; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:12px; }
  .mktx { background:var(--bg); border:1px solid var(--line); border-radius:6px;
          padding:8px 10px; margin-top:8px; font-size:12px; color:var(--dim);
          white-space:pre-wrap; word-break:break-all; cursor:pointer; }
  .mktx:hover { color:var(--fg); }
  .item { padding:8px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .hash { color:var(--fg); word-break:break-all; }
  .meta { color:var(--dim); font-size:12px; }
  .state { font-weight:700; margin-left:8px; }
  .staged { color:var(--warn); }
  .onbus { color:var(--accent); }
  .failed { color:var(--bad); }
  .mine { color:var(--accent); font-weight:700; margin-left:8px; }
  .err { color:var(--bad); font-size:12px; word-break:break-word; }
</style>
</head>
<body>
  <header>
    <span class="brand">anymone<span style="color:var(--accent)">_</span>tx</span>
    <span class="sub" id="sub">anonymous mempool · every participant sees every tx · the network never says who submitted one</span>
  </header>
  <main>
    <section id="left">
      <form id="composer" autocomplete="off">
        <textarea id="raw" placeholder="0x02f86e… raw signed transaction" spellcheck="false" required></textarea>
        <div class="row">
          <button id="sendBtn" type="submit">submit to bus</button>
          <span class="hint" id="limits"></span>
        </div>
        <div class="mktx" id="mktx" title="click to copy"></div>
      </form>
      <h2>my submissions</h2>
      <div class="scroll" id="submitted"><div class="empty">nothing submitted yet</div></div>
    </section>
    <section id="right">
      <h2>transactions on the bus</h2>
      <div class="scroll" id="bus"><div class="empty">nothing seen yet</div></div>
    </section>
  </main>
<script>
const rawEl = document.getElementById("raw");
const form = document.getElementById("composer");
const sendBtn = document.getElementById("sendBtn");
const submittedEl = document.getElementById("submitted");
const busEl = document.getElementById("bus");
const mktxEl = document.getElementById("mktx");
const limitsEl = document.getElementById("limits");

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const short = h => h ? h.slice(0, 10) + "…" + h.slice(-6) : "—";
const clock = ms => new Date(ms).toLocaleTimeString();
// wei strings can exceed Number's safe range, so divide as BigInt first.
const unit = (wei, scale, places) =>
  (Number(BigInt(wei) / 10n ** BigInt(scale)) / 10 ** places)
    .toFixed(places).replace(/\.?0+$/, "");
// Signing happens outside this page, so no key ever reaches the gateway.
const MKTX = k => `cast mktx --rpc-url http://127.0.0.1:8645 --chain ${k} \\\n`
  + `  --private-key 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \\\n`
  + `  0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC --value 1ether`;

let lastSeq = -1, chainId = null;

function renderSubmissions(subs, onBus) {
  if (!subs.length) { submittedEl.innerHTML = '<div class="empty">nothing submitted yet</div>'; return; }
  submittedEl.innerHTML = subs.map(s => {
    let state;
    if (s.error) state = '<span class="state failed">refused</span>';
    else if (s.hash && onBus.has(s.hash)) state = '<span class="state onbus">✓ on bus</span>';
    else state = '<span class="state staged">staged · waiting for a round</span>';
    return `<div class="item">`
      + `<div class="hash">${esc(short(s.hash))}${state}</div>`
      + `<div class="meta">${esc(clock(s.t_ms))}</div>`
      + (s.error ? `<div class="err">${esc(s.error)}</div>` : "")
      + `</div>`;
  }).join("");
}

function renderBus(txs) {
  if (!txs.length) { busEl.innerHTML = '<div class="empty">nothing seen yet</div>'; return; }
  busEl.innerHTML = txs.map(t => {
    const eth = unit(t.value, 12, 6);
    const gwei = unit(t.max_fee_per_gas, 3, 6);
    return `<div class="item">`
      + `<div class="hash">${esc(short(t.hash))}${t.mine ? '<span class="mine">mine</span>' : ""}</div>`
      + `<div class="meta">signed by ${esc(short(t.signer))} → ${esc(short(t.to))}</div>`
      + `<div class="meta">${eth} ETH · nonce ${t.nonce} · ${gwei} gwei · ${t.size}B · ${esc(clock(t.t_ms))}</div>`
      + `</div>`;
  }).join("");
}

async function poll() {
  try {
    const r = await fetch("/tx/feed", { cache: "no-store" });
    const feed = await r.json();
    if (chainId === null) {
      chainId = feed.chain_id;
      mktxEl.textContent = MKTX(chainId);
      limitsEl.textContent = `chain ${chainId} · max ${feed.limits.max_tx_size}B`
        + ` · min ${(Number(feed.limits.min_gas_price) / 1e9).toFixed(3)} gwei`;
    }
    const top = Math.max(
      feed.submitted.length ? feed.submitted[0].seq : -1,
      feed.bus.length ? feed.bus[0].seq : -1,
    );
    if (top === lastSeq) return;          // nothing new
    lastSeq = top;
    renderBus(feed.bus);
    renderSubmissions(feed.submitted, new Set(feed.bus.map(t => t.hash)));
  } catch (e) { /* gateway not ready; retry next tick */ }
}

mktxEl.addEventListener("click", () => navigator.clipboard?.writeText(mktxEl.textContent));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const raw = rawEl.value.trim();
  if (!raw) return;
  sendBtn.disabled = true;
  try {
    // Same origin as this page: the gateway's own eth_sendRawTransaction.
    const r = await fetch("/", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_sendRawTransaction", params: [raw] }),
    });
    const resp = await r.json();
    if (resp.result) rawEl.value = "";   // keep it on failure so it can be retried
    lastSeq = -1;                        // force a re-render
  } catch (e) { /* leave the input alone */ }
  sendBtn.disabled = false;
  poll();
});

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
