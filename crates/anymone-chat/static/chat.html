<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anymone chat</title>
<style>
  :root { --bg:#0b0e14; --panel:#121620; --line:#1d2330; --fg:#c9d3e0; --dim:#5b6878; --accent:#1fe0c8; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:12px; }
  header .brand { font-weight:700; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12px; }
  #feed { flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:680px; }
  .msg .from { color:var(--accent); font-weight:700; margin-right:8px; }
  .msg .text { color:var(--fg); word-break:break-word; }
  .empty { color:var(--dim); }
  form { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); background:var(--panel); }
  input { background:var(--bg); border:1px solid var(--line); color:var(--fg);
          padding:9px 11px; border-radius:6px; font:inherit; }
  #name { width:140px; }
  #text { flex:1; }
  button { background:var(--accent); color:#05201c; border:0; padding:9px 18px;
           border-radius:6px; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header>
    <span class="brand">anymone<span style="color:var(--accent)">_</span>chat</span>
    <span class="sub">anonymous broadcast room · senders are not revealed by the network</span>
  </header>
  <div id="feed"><div class="empty">no messages yet</div></div>
  <form id="composer" autocomplete="off">
    <input id="name" placeholder="handle" maxlength="24" required>
    <input id="text" placeholder="message" maxlength="400" required autofocus>
    <button id="sendBtn" type="submit">send</button>
  </form>
<script>
const feedEl = document.getElementById("feed");
const nameEl = document.getElementById("name");
const textEl = document.getElementById("text");
const form = document.getElementById("composer");
const sendBtn = document.getElementById("sendBtn");

const saved = localStorage.getItem("anymone-chat-handle");
if (saved) nameEl.value = saved;

let lastSeq = -1;
const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function poll() {
  try {
    const r = await fetch("/chat/feed", { cache: "no-store" });
    const msgs = await r.json();
    if (msgs.length === 0) { feedEl.innerHTML = '<div class="empty">no messages yet</div>'; return; }
    const top = msgs.length ? msgs[msgs.length - 1].seq : -1;
    if (top === lastSeq) return;          // nothing new
    lastSeq = top;
    const atBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 40;
    feedEl.innerHTML = msgs.map(m =>
      `<div class="msg"><span class="from">${esc(m.from)}</span><span class="text">${esc(m.text)}</span></div>`
    ).join("");
    if (atBottom) feedEl.scrollTop = feedEl.scrollHeight;
  } catch (e) { /* backend not ready; retry next tick */ }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const from = nameEl.value.trim(), text = textEl.value.trim();
  if (!from || !text) return;
  localStorage.setItem("anymone-chat-handle", from);
  sendBtn.disabled = true;
  try {
    await fetch("/chat/send", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ from, text }),
    });
    textEl.value = "";
  } catch (e) { /* leave the text so the user can retry */ }
  sendBtn.disabled = false;
  textEl.focus();
  poll();
});

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
