[package]
name = "anymone-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "anymone_ffi"
# staticlib for the iOS xcframework, cdylib for Android and for uniffi's
# library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anymone-core = { path = "../anymone-core" }
uniffi = { version = "0.29", features = ["tokio"] }
async-trait = "0.1"
once_cell = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# mobile-attest so the tests drive the real platform verifiers, test-util for
# their minters.
anymone-core = { path = "../anymone-core", features = [
    "test-util",
    "mobile-attest",
] }
