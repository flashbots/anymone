[workspace]
resolver = "2"
members = [
    "crates/anymone-core",
    "crates/anymone-node",
    "crates/anymone-masque",
    "crates/anymone-observer",
    "crates/anymone-chat",
    "crates/anymone-txbus",
    "crates/anymone-eth-bridge",
    "crates/anymone-gateway",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1.3"
toml = "0.8"
thiserror = "1"
rand = "0.8"
hex = "0.4"
zeroize = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
axum = "0.7"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Version-locked as a set; commonware releases every crate under one version.
commonware-p2p = "=2026.7.0"
commonware-stream = "=2026.7.0"
commonware-runtime = "=2026.7.0"
commonware-cryptography = "=2026.7.0"
commonware-utils = "=2026.7.0"
commonware-codec = "=2026.7.0"
# Exact-pinned (not caret) so the tx-bus wire encoding stays reproducible
# across builds rather than drifting with whatever the resolver picks up.
alloy-consensus = { version = "=2.1.1", default-features = false }
alloy-eips = { version = "=2.1.1", default-features = false }
alloy-primitives = { version = "=1.6.1", default-features = false }
