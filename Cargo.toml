[workspace]
resolver = "2"
members = [
    "crates/anymone-core",
    "crates/anymone-node",
    "crates/anymone-masque",
    "crates/anymone-observer",
    "crates/anymone-chat",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1.3"
toml = "0.8"
thiserror = "1"
rand = "0.8"
hex = "0.4"
zeroize = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
libp2p = { version = "0.55", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "kad", "identify", "macros", "ed25519", "dns", "request-response", "cbor"] }
axum = "0.7"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
